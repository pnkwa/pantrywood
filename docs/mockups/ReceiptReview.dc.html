<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Receipt Review</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--cream:#F6EFE2;--paper:#FFFBF3;--oat:#EADFC9;--linen:#F1E7D4;--bark:#4A3B2E;--bark-soft:#7A6654;--sage:#8FA67A;--sage-deep:#5E7550;--terracotta:#C8755A;--honey:#E2B25C;--shadow:0 1px 0 rgba(74,59,46,.06),0 10px 28px -8px rgba(74,59,46,.18)}
body{margin:0;background:#F6EFE2}
a{color:#5E7550}a:hover{color:#3F5236}
button{font-family:inherit}
</style>
</helmet>
<div style="height: 100vh; min-height: 680px; overflow: auto; background: var(--cream); color: var(--bark); font-family: 'DM Sans', 'IBM Plex Sans Thai', sans-serif; font-size: 16px; box-sizing: border-box; padding: 20px 24px 24px; display: flex; flex-direction: column">
<div style="flex: 1; min-height: 0; width: 100%; max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px">
<a href="ScanDesktop.dc.html" aria-label="Back to scan" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--oat); background: var(--paper); display: flex; align-items: center; justify-content: center; color: var(--bark)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; line-height: 1.15">
<span style="font-size: 13px; color: var(--bark-soft)">Review receipt</span>
<h1 style="margin: 0; font-weight: 600; letter-spacing: -0.02em; font-size: 26px">Big C <span style="font-weight: 500; color: var(--bark-soft); font-size: 18px">· 8 Oct, 17:42</span></h1>
</div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: inline-flex; flex-direction: column; padding: 6px 14px; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--oat)"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Lines</span><span style="font-size: 16px; font-weight: 600">5</span></span>
<span style="display: inline-flex; flex-direction: column; padding: 6px 14px; border-radius: 14px; background: var(--paper); border: 1.5px solid var(--oat)"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Total</span><span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">474.00 ฿</span></span>
<span style="display: inline-flex; flex-direction: column; padding: 6px 14px; border-radius: 14px; background: #E3EAD9; color: #3F5236"><span style="font-size: 11px; font-weight: 600">Matched</span><span style="font-size: 16px; font-weight: 600">4</span></span>
<span style="display: inline-flex; flex-direction: column; padding: 6px 14px; border-radius: 14px; background: #FFF6E2; color: #6B4A0E; border: 1.5px solid #E2B25C"><span style="font-size: 11px; font-weight: 600">Needs you</span><span style="font-size: 16px; font-weight: 600">1</span></span>
</div>
</header>

<div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap; gap: 20px; align-items: stretch">

<section aria-label="Receipt photo" style="flex: 1 1 340px; max-width: 440px; min-width: 0; min-height: 0; box-sizing: border-box; position: relative; background: #EFE6D3; border-radius: 28px; padding: 20px 20px 64px; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 320 480" role="img" aria-label="Photo of the Big C receipt. Five numbered lines and a total of 474 baht; line 5, jasmine rice, is highlighted." style="display: block; height: 100%; width: auto; max-width: 100%; filter: drop-shadow(0 10px 14px rgba(74,59,46,.25))">
<g transform="rotate(-1.2 160 240)">
<path d="M30,10 H300 V450 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 l-10,-10 l-10,10 Z" fill="#FFFFFF"></path>
<g font-family="DM Sans, IBM Plex Sans Thai, sans-serif" fill="#4A3B2E" font-size="14">
<text x="165" y="52" text-anchor="middle" font-size="20" font-weight="600">BIG C</text>
<text x="165" y="74" text-anchor="middle" fill="#7A6654" font-size="12">08/10/2569 · 17:42</text>
<text x="52" y="122">นมสด 1L</text><text x="282" y="122" text-anchor="end">52.00</text>
<text x="52" y="152">ทิชชู่ 6 ม้วน</text><text x="282" y="152" text-anchor="end">89.00</text>
<text x="52" y="182">โหระพา</text><text x="282" y="182" text-anchor="end">15.00</text>
<text x="52" y="212">แชมพู</text><text x="282" y="212" text-anchor="end">129.00</text>
<rect x="42" y="225" width="248" height="26" rx="6" fill="#E2B25C" fill-opacity=".22" stroke="#C8901F" stroke-width="1.5"></rect>
<text x="52" y="242">ข้าวหอมมะลิ 5kg</text><text x="282" y="242" text-anchor="end">189.00</text>
<path d="M52,266 H282" stroke="#C9B79A" stroke-dasharray="4 4"></path>
<text x="52" y="292" font-weight="600">รวม</text><text x="282" y="292" text-anchor="end" font-weight="600">474.00</text>
</g>
<path d="M78,330 v48 M84,330 v48 M91,330 v48 M95,330 v48 M102,330 v48 M110,330 v48 M114,330 v48 M122,330 v48 M128,330 v48 M136,330 v48 M140,330 v48 M148,330 v48 M155,330 v48 M159,330 v48 M167,330 v48 M174,330 v48 M179,330 v48 M187,330 v48 M192,330 v48 M200,330 v48 M206,330 v48 M213,330 v48 M219,330 v48 M226,330 v48 M232,330 v48 M239,330 v48 M246,330 v48 M252,330 v48" stroke="#4A3B2E" stroke-width="3"></path>
<g font-family="DM Sans, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
<circle cx="22" cy="117" r="11" fill="#5E7550"></circle><text x="22" y="121" fill="#FFFBF3">1</text>
<circle cx="22" cy="147" r="11" fill="#5E7550"></circle><text x="22" y="151" fill="#FFFBF3">2</text>
<circle cx="22" cy="177" r="11" fill="#5E7550"></circle><text x="22" y="181" fill="#FFFBF3">3</text>
<circle cx="22" cy="207" r="11" fill="#5E7550"></circle><text x="22" y="211" fill="#FFFBF3">4</text>
<circle cx="22" cy="238" r="11" fill="#C8901F"></circle><text x="22" y="242" fill="#FFFBF3">5</text>
</g>
</g>
</svg>
<div style="position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,251,243,.92); box-shadow: var(--shadow)">
<button type="button" aria-label="Zoom out" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; font-size: 18px; font-weight: 600; color: var(--bark); cursor: pointer">−</button>
<button type="button" aria-label="Zoom in" style="width: 36px; height: 36px; border-radius: 999px; border: 0; background: transparent; font-size: 18px; font-weight: 600; color: var(--bark); cursor: pointer">+</button>
<button type="button" style="height: 36px; padding: 0 12px; border-radius: 999px; border: 0; background: transparent; font-size: 13px; font-weight: 600; color: var(--bark); cursor: pointer">Retake</button>
</div>
</section>

<section aria-label="Matched lines" style="flex: 2 1 540px; min-width: 0; min-height: 0; max-height: 100%; box-sizing: border-box; background: var(--paper); border: 1.5px solid var(--oat); border-radius: 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden">
<div style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px">
<div role="tablist" aria-label="Filter lines" style="display: flex; gap: 4px; padding: 4px; background: var(--linen); border-radius: 999px">
<button type="button" role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--paper); box-shadow: 0 2px 6px rgba(74,59,46,.12); font-size: 13px; font-weight: 600; color: var(--bark); cursor: pointer">All 5</button>
<button type="button" role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; font-size: 13px; font-weight: 500; color: var(--bark-soft); cursor: pointer">Needs you 1</button>
</div>
<span style="margin-left: auto; font-size: 13px; color: var(--bark-soft)">Tap a match to change it</span>
</div>

<div style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 8px">

<div style="display: flex; flex-direction: column; gap: 12px; padding: 14px; border-radius: 20px; border: 2px solid #E2B25C; background: #FFF6E2">
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: none; width: 26px; height: 26px; border-radius: 999px; background: #C8901F; color: #FFFBF3; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">5</span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 13px; color: var(--bark-soft)">ข้าวหอมมะลิ 5kg</span><span style="font-size: 16px; font-weight: 600">Which item is this?</span></span>
<span style="flex: none; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">189.00 ฿</span>
</div>
<div role="radiogroup" aria-label="Pick the matching item" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px">
<button type="button" role="radio" aria-checked="true" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 2px solid #5E7550; background: var(--paper); text-align: left; cursor: pointer; color: var(--bark)">
<svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M26,20 h12 q12,6 12,24 q0,12 -6,14 h-24 q-6,-2 -6,-14 q0,-18 12,-24 z" fill="#EFE4CF"></path><rect x="25" y="16" width="14" height="5" rx="2" fill="#C8755A"></rect><rect x="22" y="34" width="20" height="12" rx="3" fill="#FFFBF3"></rect></svg>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 600">Jasmine rice</span><span style="font-size: 12px; color: #3F5236">Best guess · fills Rice bin</span></span>
</button>
<button type="button" role="radio" aria-checked="false" style="display: flex; align-items: center; gap: 10px; padding: 10px; border-radius: 14px; border: 1.5px solid var(--oat); background: var(--paper); text-align: left; cursor: pointer; color: var(--bark)">
<svg width="34" height="34" viewBox="0 0 64 64" aria-hidden="true"><path d="M26,20 h12 q12,6 12,24 q0,12 -6,14 h-24 q-6,-2 -6,-14 q0,-18 12,-24 z" fill="#E9D3B0"></path><rect x="25" y="16" width="14" height="5" rx="2" fill="#8FA67A"></rect></svg>
<span style="display: flex; flex-direction: column; line-height: 1.2"><span style="font-size: 14px; font-weight: 600">Sticky rice</span><span style="font-size: 12px; color: var(--bark-soft)">Pantry shelf</span></span>
</button>
<button type="button" style="display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px; border-radius: 14px; border: 1.5px dashed #A9BC95; background: transparent; font-size: 14px; font-weight: 600; color: var(--sage-deep); cursor: pointer">+ New product</button>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="font-size: 13px; color: var(--bark-soft)">Amount</span>
<span style="display: inline-flex; align-items: center; height: 36px; padding: 0 14px; border-radius: 999px; background: var(--paper); border: 1.5px solid var(--oat); font-size: 14px; font-weight: 600">5 kg</span>
<span style="font-size: 13px; color: var(--bark-soft)">Rice bin goes from Low to <b style="color: #3F5236">Full</b></span>
</div>
</div>

<sc-for list="{{lines}}" as="l" hint-placeholder-count="4">
<div style="display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 18px; border: 1.5px solid var(--oat); background: #FFFDF8">
<span style="flex: none; width: 26px; height: 26px; border-radius: 999px; background: #5E7550; color: #FFFBF3; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: center">{{l.n}}</span>
<span style="flex: none; width: 44px; height: 44px; border-radius: 12px; background: {{l.tint}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600">{{l.initial}}</span>
<button type="button" style="flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 0; border: 0; background: transparent; text-align: left; cursor: pointer; color: var(--bark)">
<span style="font-size: 13px; color: var(--bark-soft)">{{l.raw}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 16px; font-weight: 600">{{l.item}}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#7A6654" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span>
<span style="font-size: 12px; color: #4C6140">{{l.note}}</span>
</button>
<span style="flex: none; display: inline-flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 999px; background: var(--linen); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.qty}}</span>
<span style="flex: none; width: 70px; text-align: right; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums">{{l.price}}</span>
</div>
</sc-for>
</div>

<div style="border-top: 1.5px solid var(--oat); padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; background: var(--paper)">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 18px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #3F5236"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>Lines add up to <b>474.00 ฿</b>, same as the receipt</span>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 36px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #5E7550">Pin slip on the pegboard</label>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; min-height: 36px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #5E7550">Remember matches</label>
</div>
<button type="button" style="height: 52px; border-radius: 999px; border: 0; background: var(--sage-deep); color: #FFFBF3; font-size: 16px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 #3F5236">Add 5 items to stock</button>
</div>
</section>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      lines: [
        { n: '1', initial: 'M', tint: '#E1ECEE', raw: 'นมสด 1L', item: 'Fresh milk', note: 'Remembered match · Fridge', qty: '1 carton', price: '52.00' },
        { n: '2', initial: 'T', tint: '#F3EEE4', raw: 'ทิชชู่ 6 ม้วน', item: 'Tissue rolls', note: 'Remembered match · Home supplies', qty: '6 rolls', price: '89.00' },
        { n: '3', initial: 'B', tint: '#E3EAD9', raw: 'โหระพา', item: 'Thai basil', note: 'Matched by name · Fridge', qty: '1 bunch', price: '15.00' },
        { n: '4', initial: 'S', tint: '#F4E0D7', raw: 'แชมพู', item: 'Shampoo', note: 'Remembered match · Home supplies', qty: '1 bottle', price: '129.00' }
      ]
    };
  }
}
</script>
</body>
</html>
