<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Scan Mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--paper:#FFFBF3;--oat:#EADFC9;--linen:#F1E7D4;--bark:#4A3B2E;--bark-soft:#7A6654;--sage:#8FA67A;--sage-deep:#5E7550}
body{margin:0}
a{color:#5E7550}a:hover{color:#3F5236}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #2B261F; color: var(--bark); font-family: 'DM Sans', 'IBM Plex Sans Thai', sans-serif">

<svg width="390" height="844" viewBox="0 0 390 844" aria-hidden="true" style="position: absolute; inset: 0">
<defs><filter id="blur"><feGaussianBlur stdDeviation="18"></feGaussianBlur></filter></defs>
<rect width="390" height="844" fill="#3A322A"></rect>
<g filter="url(#blur)" opacity=".85">
<rect x="-20" y="120" width="430" height="20" fill="#E8DFCF"></rect>
<rect x="-20" y="420" width="430" height="20" fill="#E8DFCF"></rect>
<rect x="40" y="160" width="80" height="240" rx="20" fill="#C9A77C"></rect>
<rect x="270" y="180" width="90" height="220" rx="20" fill="#A9C4C9"></rect>
<circle cx="200" cy="300" r="110" fill="#E7D3B0"></circle>
<rect x="60" y="460" width="120" height="160" rx="20" fill="#8FA67A"></rect>
</g>
<rect width="390" height="844" fill="#2B261F" opacity=".35"></rect>
</svg>

<header style="position: absolute; left: 16px; right: 16px; top: 16px; display: flex; align-items: center; gap: 8px">
<a href="Mobile.dc.html" aria-label="Close scanner" style="width: 44px; height: 44px; border-radius: 999px; background: rgba(43,38,31,.55); display: flex; align-items: center; justify-content: center; color: #FFFBF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<div role="tablist" aria-label="What to scan" style="flex: 1; display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(43,38,31,.55)">
<button type="button" role="tab" aria-selected="true" style="flex: 1; height: 36px; border-radius: 999px; border: 0; background: #FFFBF3; color: var(--bark); font-size: 14px; font-weight: 600">Barcode</button>
<button type="button" role="tab" aria-selected="false" style="flex: 1; height: 36px; border-radius: 999px; border: 0; background: transparent; color: #F3EADB; font-size: 14px; font-weight: 500">Receipt</button>
</div>
<button type="button" aria-label="Flashlight" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: rgba(43,38,31,.55); display: flex; align-items: center; justify-content: center; color: #FFFBF3"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L5 13h6l-1 9 8-11h-6z"></path></svg></button>
</header>

<div role="radiogroup" aria-label="What happens after a scan" style="position: absolute; left: 50%; top: 76px; transform: translateX(-50%); display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(43,38,31,.55)">
<button type="button" role="radio" aria-checked="true" style="height: 34px; padding: 0 16px; border-radius: 999px; border: 0; background: #5E7550; color: #FFFBF3; font-size: 13px; font-weight: 600">Add</button>
<button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: #F3EADB; font-size: 13px; font-weight: 500">Eat</button>
<button type="button" role="radio" aria-checked="false" style="height: 34px; padding: 0 16px; border-radius: 999px; border: 0; background: transparent; color: #F3EADB; font-size: 13px; font-weight: 500">Check</button>
</div>

<div style="position: absolute; left: 45px; top: 150px; width: 300px; height: 190px">
<svg width="300" height="190" viewBox="0 0 300 190" aria-hidden="true" style="position: absolute; inset: 0">
<path d="M4,40 V20 a16,16 0 0 1 16,-16 H40 M260,4 H280 a16,16 0 0 1 16,16 V40 M296,150 V170 a16,16 0 0 1 -16,16 H260 M40,186 H20 a16,16 0 0 1 -16,-16 V150" fill="none" stroke="#FFFBF3" stroke-width="5" stroke-linecap="round"></path>
<rect x="60" y="56" width="180" height="78" rx="6" fill="#FFFFFF" opacity=".9"></rect>
<g fill="#2B261F"><rect x="72" y="64" width="3" height="54"></rect><rect x="78" y="64" width="1.5" height="54"></rect><rect x="83" y="64" width="4" height="54"></rect><rect x="90" y="64" width="2" height="54"></rect><rect x="96" y="64" width="3" height="54"></rect><rect x="103" y="64" width="1.5" height="54"></rect><rect x="108" y="64" width="4" height="54"></rect><rect x="116" y="64" width="2" height="54"></rect><rect x="122" y="64" width="3" height="54"></rect><rect x="129" y="64" width="1.5" height="54"></rect><rect x="134" y="64" width="2" height="54"></rect><rect x="140" y="64" width="4" height="54"></rect><rect x="148" y="64" width="2" height="54"></rect><rect x="154" y="64" width="3" height="54"></rect><rect x="161" y="64" width="1.5" height="54"></rect><rect x="166" y="64" width="4" height="54"></rect><rect x="174" y="64" width="2" height="54"></rect><rect x="180" y="64" width="3" height="54"></rect><rect x="187" y="64" width="1.5" height="54"></rect><rect x="192" y="64" width="4" height="54"></rect><rect x="200" y="64" width="2" height="54"></rect><rect x="206" y="64" width="3" height="54"></rect><rect x="213" y="64" width="2" height="54"></rect><rect x="219" y="64" width="4" height="54"></rect><rect x="226" y="64" width="2" height="54"></rect></g>
<text x="150" y="129" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="9" fill="#2B261F" letter-spacing="2">8 850000 123456</text>
<rect x="56" y="52" width="188" height="86" rx="9" fill="none" stroke="#A9D18E" stroke-width="3"></rect>
<rect x="20" y="93" width="260" height="3" rx="1.5" fill="#A9D18E" opacity=".9"></rect>
</svg>
</div>
<p style="position: absolute; left: 0; right: 0; top: 352px; margin: 0; text-align: center; font-size: 14px; color: #F3EADB">Found it · or use your barcode scanner</p>
<span style="position: absolute; left: 50%; top: 378px; transform: translateX(-50%); display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 999px; background: rgba(43,38,31,.55); color: #F3EADB; font-size: 12px; white-space: nowrap"><span style="width: 8px; height: 8px; border-radius: 999px; background: #A9D18E"></span>USB scanner ready</span>

<section aria-label="Scanned item" style="position: absolute; left: 0; right: 0; bottom: 0; top: 416px; background: var(--paper); border-radius: 28px 28px 0 0; padding: 10px 16px 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 -16px 32px -16px rgba(0,0,0,.5)">
<span style="display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--oat); margin: 0 auto"></span>
<div style="display: flex; align-items: center; gap: 12px">
<span style="flex: none; width: 60px; height: 60px; border-radius: 16px; background: #F6EFE2; display: flex; align-items: center; justify-content: center"><svg width="48" height="42" viewBox="0 0 64 56" aria-hidden="true"><rect x="6" y="30" width="52" height="20" rx="4" fill="#E7D3B0"></rect><g fill="#FBF4E6"><ellipse cx="14" cy="28" rx="6" ry="7.5"></ellipse><ellipse cx="27" cy="28" rx="6" ry="7.5"></ellipse><ellipse cx="40" cy="28" rx="6" ry="7.5"></ellipse><ellipse cx="52" cy="28" rx="5.5" ry="7.5"></ellipse></g></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-size: 20px; font-weight: 600; letter-spacing: -0.02em">Eggs <span style="font-size: 14px; font-weight: 500; color: var(--bark-soft)">ไข่ไก่</span></span><span style="font-size: 13px; color: var(--bark-soft)">Tray of 10 · you have 6</span></span>
<span style="flex: none; display: inline-flex; padding: 3px 9px; border-radius: 999px; background: #E3EAD9; color: #3F5236; font-size: 12px; font-weight: 600">Found</span>
</div>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="font-size: 14px; font-weight: 600">Amount</span>
<div role="group" aria-label="Amount to add" style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 999px; background: var(--linen)">
<button type="button" aria-label="Less" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--paper); font-size: 18px; font-weight: 600; color: var(--bark)">−</button>
<span style="min-width: 64px; text-align: center; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums">10 pcs</span>
<button type="button" aria-label="More" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--paper); font-size: 18px; font-weight: 600; color: var(--bark)">+</button>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--oat); background: #FFFDF8; color: var(--bark); text-align: left"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Put in</span><span style="font-size: 14px; font-weight: 600">Fridge · Shelf 1</span></button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--oat); background: #FFFDF8; color: var(--bark); text-align: left"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Best before</span><span style="font-size: 14px; font-weight: 600">24 Oct · +14 days</span></button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--oat); background: #FFFDF8; color: var(--bark); text-align: left"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Price</span><span style="font-size: 14px; font-weight: 600">42 ฿ · optional</span></button>
<button type="button" style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; padding: 10px 12px; border-radius: 16px; border: 1.5px solid var(--oat); background: #FFFDF8; color: var(--bark); text-align: left"><span style="font-size: 11px; font-weight: 600; color: var(--bark-soft)">Shop</span><span style="font-size: 14px; font-weight: 600">Fresh market</span></button>
</div>

<button type="button" style="height: 54px; border-radius: 999px; border: 0; background: var(--sage-deep); color: #FFFBF3; font-size: 16px; font-weight: 600; box-shadow: 0 3px 0 #3F5236">Add 10 eggs to the fridge</button>
<div style="display: flex; justify-content: space-between; align-items: center">
<button type="button" style="height: 40px; padding: 0 4px; border: 0; background: transparent; color: var(--bark-soft); font-size: 14px; font-weight: 600">Not right?</button>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: var(--bark-soft); min-height: 40px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #5E7550">Keep scanning</label>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
