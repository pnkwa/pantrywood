<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Decorate Room</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
:root{--cream:#F6EFE2;--paper:#FFFBF3;--oat:#EADFC9;--linen:#F1E7D4;--bark:#4A3B2E;--bark-soft:#7A6654;--sage:#8FA67A;--sage-deep:#5E7550;--terracotta:#C8755A;--honey:#E2B25C;--shadow:0 1px 0 rgba(74,59,46,.06),0 10px 28px -8px rgba(74,59,46,.18)}
body{margin:0;background:#F6EFE2}
a{color:#5E7550}a:hover{color:#3F5236}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 100vh; background: var(--cream); color: var(--bark); font-family: 'DM Sans', 'IBM Plex Sans Thai', sans-serif; font-size: 16px; box-sizing: border-box; padding: 20px 24px 32px">
<div style="max-width: 1392px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: var(--paper); border: 1.5px solid var(--oat); border-radius: 22px; padding: 12px 16px; box-shadow: var(--shadow)">
<a href="Main.dc.html" aria-label="Back to storage room" style="width: 44px; height: 44px; border-radius: 999px; border: 1.5px solid var(--oat); display: flex; align-items: center; justify-content: center; color: var(--bark)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<div style="display: flex; flex-direction: column; line-height: 1.15">
<span style="font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sage-deep)">Decorate mode</span>
<span style="font-weight: 600; letter-spacing: -0.02em; font-size: 24px">Storage room</span>
</div>
<div style="margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px">
<span style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 14px; border-radius: 999px; background: #E3EAD9; color: #3F5236; font-weight: 600; font-variant-numeric: tabular-nums">
<svg width="18" height="18" viewBox="0 0 24 24" fill="#8FA67A" stroke="#4C6140" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 10 10 5 19 5c0 9-5 14-14 14z"></path><path d="M5 19l8-8" fill="none"></path></svg>
340 leaves
</span>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--oat); background: var(--linen); color: var(--bark); font-size: 15px; font-weight: 600; cursor: pointer">Undo</button>
<button type="button" style="height: 44px; padding: 0 20px; border-radius: 999px; border: 0; background: var(--sage-deep); color: #FFFBF3; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 #3F5236">Save room</button>
</div>
</header>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start">

<div style="flex: 999 1 600px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Room preview" style="position: relative; border-radius: 28px; border: 1.5px solid var(--oat); overflow: hidden; background: radial-gradient(120% 90% at 50% 35%, #FBF4E8 0%, #EFE6D3 100%); box-shadow: var(--shadow)">
<div style="position: relative; width: 100%; max-width: 820px; margin: 16px auto 0">
<img src="storage-room.svg" alt="The storage room in decorate mode, with the cream retro fridge selected for swapping" style="display: block; width: 100%; height: auto">
<svg viewBox="0 0 800 600" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none">
<polygon points="400,230 700,380 400,530 100,380" fill="none" stroke="#FFFBF3" stroke-width="2" stroke-dasharray="6 6" opacity=".9"></polygon>
<polygon points="505,147.5 571,180.5 571,318.5 517,345.5 451,312.5 451,174.5" fill="#E2B25C" fill-opacity=".12" stroke="#C8901F" stroke-width="3" stroke-dasharray="8 6" stroke-linejoin="round"></polygon>
</svg>
<div role="toolbar" aria-label="Selected: Retro round-top fridge" style="position: absolute; left: 64%; top: 59%; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px; background: var(--paper); border: 1.5px solid var(--oat); border-radius: 18px; box-shadow: 0 12px 24px -12px rgba(74,59,46,.5); white-space: nowrap">
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: #F6E6C4; color: #6B4A0E; font-size: 14px; font-weight: 600; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h13l-3-3M20 17H7l3 3"></path></svg>Swap style</button>
<button type="button" aria-label="Rotate" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7"></path><path d="M20 4v5h-5"></path></svg></button>
<button type="button" aria-label="Move" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18M3 12h18M9 6l3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"></path></svg></button>
<button type="button" aria-label="Put away" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A3B2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v12H4z"></path><path d="M3 4h18v4H3zM10 12h4"></path></svg></button>
</div>
</div>
<p style="margin: 0; padding: 12px 18px 16px; font-size: 13px; color: var(--bark-soft)">Tap a piece to select · drag to move on the grid · storage furniture keeps its Grocy location when you swap its style</p>
</section>

<section aria-label="Room themes" style="background: var(--paper); border: 1.5px solid var(--oat); border-radius: 24px; padding: 16px 18px; box-shadow: var(--shadow)">
<div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px">
<h3 style="margin: 0; font-weight: 600; letter-spacing: -0.02em; font-size: 18px">Room themes</h3>
<span style="font-size: 13px; color: var(--bark-soft)">Applies wallpaper, floor and furniture together</span>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
<button type="button" style="text-align: left; padding: 10px; border-radius: 16px; border: 1.5px solid {{t.border}}; background: #FFFDF8; cursor: pointer; display: flex; flex-direction: column; gap: 8px; color: var(--bark)">
<span style="display: flex; height: 44px; border-radius: 10px; overflow: hidden"><span style="flex: 1; background: {{t.wall}}"></span><span style="flex: 1; background: {{t.floor}}"></span><span style="flex: 1; background: {{t.accent}}"></span></span>
<span style="font-size: 14px; font-weight: 600">{{t.name}}</span>
<span style="font-size: 12px; color: var(--bark-soft)">{{t.desc}}</span>
</button>
</sc-for>
</div>
</section>
</div>

<aside aria-label="Catalog" style="flex: 1 1 420px; min-width: 0; background: var(--paper); border: 1.5px solid var(--oat); border-radius: 28px; padding: 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">
<h2 style="margin: 0; font-weight: 600; letter-spacing: -0.02em; font-size: 24px">Catalog</h2>
<a href="Catalog.dc.html" style="font-size: 14px; font-weight: 600">See all items</a>
</div>
<div role="tablist" aria-label="Catalog category" style="display: flex; flex-wrap: wrap; gap: 4px; padding: 4px; background: var(--linen); border-radius: 18px">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="5">
<button type="button" role="tab" aria-selected="{{tab.sel}}" style="flex: 1 1 auto; height: 36px; padding: 0 10px; border-radius: 14px; border: 0; background: {{tab.bg}}; box-shadow: {{tab.shadow}}; font-size: 13px; font-weight: 600; color: {{tab.fg}}; cursor: pointer; white-space: nowrap">{{tab.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px" aria-label="Filter by style">
<sc-for list="{{styleChips}}" as="s" hint-placeholder-count="5">
<button type="button" aria-pressed="{{s.sel}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1.5px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-size: 13px; font-weight: 600; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px">
<sc-for list="{{storage}}" as="it" hint-placeholder-count="12">
<button type="button" style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 8px 10px; border-radius: 18px; border: 2px solid {{it.cardBorder}}; background: {{it.cardBg}}; cursor: pointer; color: var(--bark); font: inherit; text-align: center">
<dc-import name="Thumb" item="{{it}}" hint-size="96px,76px"></dc-import>
<span style="font-size: 13px; font-weight: 600; line-height: 1.2">{{it.name}}</span>
<span style="display: inline-flex; padding: 2px 8px; border-radius: 999px; background: {{it.chipBg}}; color: {{it.chipFg}}; font-size: 11px; font-weight: 600">{{it.style}}</span>
<span style="font-size: 12px; font-weight: 600; color: {{it.priceFg}}; font-variant-numeric: tabular-nums">{{it.priceLabel}}</span>
</button>
</sc-for>
</div>
</aside>
</div>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    var chip = {
      Nordic: ['#E1ECEE', '#2F4E55'], Natural: ['#F1E7D4', '#5E4A38'],
      Japandi: ['#E3EAD9', '#3F5236'], Retro: ['#F4E0D7', '#8A4430']
    };
    var raw = [
      ['Retro round-top fridge', 'Retro', 'tall', '#FBF4E6', '#F3EADB', '#E0D2B7', 'placed', true],
      ['Retro fridge · mint', 'Retro', 'tall', '#E4EEDC', '#C9DDBE', '#B2C9A5', 120],
      ['Retro fridge · butter', 'Retro', 'tall', '#FBEFC9', '#F2D98F', '#E3C46E', 120],
      ['Slim white fridge', 'Nordic', 'tall', '#FFFFFF', '#F1F1EE', '#DCDCD6', 90],
      ['Oak-panel fridge', 'Japandi', 'tall', '#E9D3B0', '#D6B88A', '#C29F70', 160],
      ['Chest freezer · sky', 'Retro', 'low', '#E1ECEE', '#C9DCE0', '#A9C4C9', 'placed'],
      ['Walnut pantry shelf', 'Retro', 'shelf', '#C49770', '#A47551', '#6E4E33', 'placed'],
      ['Birch cube shelf', 'Nordic', 'shelf', '#F1E6CF', '#DCC6A0', '#C9AE84', 60],
      ['Pine open shelf', 'Natural', 'shelf', '#EAD8B6', '#D2B98E', '#BDA276', 55],
      ['Steel unit shelf', 'Natural', 'shelf', '#ECECE8', '#C9CAC5', '#A9AAA4', 70],
      ['Oak ladder shelf', 'Japandi', 'ladder', '#C49770', '#8C6440', '#8C6440', 50],
      ['Butter open cabinet', 'Retro', 'mid', '#F4DFA6', '#E9C46E', '#E3BD62', 'placed'],
      ['Rattan cabinet', 'Japandi', 'mid', '#E8D2A6', '#CFAE76', '#B8955E', 90],
      ['Bamboo drawers', 'Japandi', 'mid', '#EDDBB0', '#D6BB86', '#C2A46E', 70],
      ['Mint rolling cart', 'Nordic', 'mid', '#DCEAE1', '#BFD6C8', '#A6C2B1', 40],
      ['Wooden crate stack', 'Natural', 'low', '#D9B183', '#C49770', '#A47551', 'placed'],
      ['Rice barrel', 'Retro', 'round', '#B88A5F', '#8C6A4A', '#8C6A4A', 'placed'],
      ['Ceramic rice jar', 'Japandi', 'round', '#F3EEE4', '#DED4C3', '#DED4C3', 45],
      ['Enamel bread bin', 'Retro', 'low', '#EEF3F6', '#CFDBE4', '#B5C6D3', 35],
      ['Wicker basket set', 'Japandi', 'basket', '#D9B183', '#B98B57', '#B98B57', 'owned']
    ];
    var storage = raw.map(function (r) {
      var p = r[6];
      var c = chip[r[1]];
      var sel = r[7] === true;
      return {
        name: r[0], style: r[1], kind: r[2], c1: r[3], c2: r[4], c3: r[5],
        chipBg: c[0], chipFg: c[1],
        priceLabel: p === 'placed' ? 'In room' : p === 'owned' ? 'Owned' : p + ' leaves',
        priceFg: (p === 'placed' || p === 'owned') ? '#4C6140' : '#7A6654',
        cardBorder: sel ? '#C8901F' : '#EADFC9',
        cardBg: sel ? '#FFF6E2' : '#FFFDF8'
      };
    });
    var tabNames = [['Storage', 20], ['Shelf items', 9], ['Wallpaper', 7], ['Floor', 6], ['Decor', 8], ['Pegboard', 8]];
    var tabs = tabNames.map(function (t, i) {
      var on = i === 0;
      return { label: t[0] + ' ' + t[1], sel: on ? 'true' : 'false', bg: on ? '#FFFBF3' : 'transparent', fg: on ? '#4A3B2E' : '#7A6654', shadow: on ? '0 2px 6px rgba(74,59,46,.12)' : 'none' };
    });
    var styleChips = ['All styles', 'Nordic', 'Natural', 'Japandi', 'Retro'].map(function (s, i) {
      var on = i === 0;
      var c = chip[s];
      return { label: s, sel: on ? 'true' : 'false', bg: on ? '#4A3B2E' : (c ? c[0] : '#FFFBF3'), fg: on ? '#FFFBF3' : (c ? c[1] : '#4A3B2E'), border: on ? '#4A3B2E' : 'transparent' };
    });
    var themes = [
      { name: 'Retro pantry', desc: 'Checker tile, gingham, cream fridge', wall: '#F7EFE1', floor: 'conic-gradient(#D3E2E6 25%,#F3E7CF 0 50%,#D3E2E6 0 75%,#F3E7CF 0) 0 0/14px 14px', accent: '#E9A9A9', border: '#C8901F' },
      { name: 'Japandi calm', desc: 'Washi walls, tatami, oak and rattan', wall: 'linear-gradient(#E3D8C2 1px,transparent 1px) 0 0/10px 10px, linear-gradient(90deg,#E3D8C2 1px,#FBF7EE 1px) 0 0/10px 10px', floor: 'repeating-linear-gradient(90deg,#D9D2A0 0 2px,#CFC58E 2px 4px)', accent: '#8FA67A', border: '#EADFC9' },
      { name: 'Natural minimal', desc: 'Plaster, cork, pine and steel', wall: '#F3EEE4', floor: 'radial-gradient(#B48E5E 1px,transparent 1.5px) 0 0/6px 6px, #D9B68A', accent: '#C9CAC5', border: '#EADFC9' },
      { name: 'Nordic bright', desc: 'White shiplap, light oak, birch', wall: 'repeating-linear-gradient(0deg,#FAFAF7 0 9px,#E6E4DC 9px 10px)', floor: 'repeating-linear-gradient(90deg,#E6CFA6 0 14px,#D8BE90 14px 15px)', accent: '#A9C4C9', border: '#EADFC9' }
    ];
    return { storage: storage, tabs: tabs, styleChips: styleChips, themes: themes };
  }
}
</script>
</body>
</html>
